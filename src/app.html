<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link
			rel="icon"
			href="%sveltekit.assets%/icons/icon-192.png"
			type="image/png"
			sizes="192x192"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta name="theme-color" content="#1e2035" />
		<meta name="description" content="Personal budget tracking and management" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Budget" />
		<script nonce="%sveltekit.nonce%">
			const mode = localStorage.getItem('mode-watcher-mode') ?? 'system';
			const dark =
				mode === 'dark' ||
				(mode === 'system' && !window.matchMedia('(prefers-color-scheme: light)').matches);
			document.documentElement.classList.toggle('dark', dark);
			document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
