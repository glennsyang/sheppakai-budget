name: Weekly Summary Email

on:
  schedule:
    - cron: '10 16 * * 1' # Monday 8:10am PST / 9:10am PDT
  workflow_dispatch: # Allow manual trigger

# Only curls the app with CRON_SECRET; needs no GITHUB_TOKEN scopes.
permissions: {}

jobs:
  trigger-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly summary email
        env:
          CRON_SECRET: ${{ secrets['CRON_SECRET'] }}
          APP_URL: ${{ secrets['APP_URL'] }}
        run: |
          response=$(curl -f -X POST $APP_URL/api/cron/email-weekly-summary \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")
          echo "$response"
          echo "$response" | jq -e '.result.emailsFailed == 0'
